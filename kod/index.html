<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa – sprawdź, kogo wylosowałeś</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2a24; --card:#fffaf2; --ink:#1e1b18; --muted:#6b645c;
    --red:#c8372d; --red-d:#a02a22; --green:#1f6b55; --gold:#e3b04b; --line:#e8dfd1;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 20% 0%,#1d4a3e 0,var(--bg) 60%);min-height:100vh;
    padding:24px 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;color:#fff;margin-bottom:18px}
  header h1{font-family:Fraunces,serif;font-weight:800;font-size:2.1rem;margin:0;letter-spacing:-.5px}
  header p{margin:6px 0 0;color:#cfe3db;font-size:.95rem}
  .tabs{display:flex;background:rgba(255,255,255,.08);border-radius:14px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;color:#d8ebe4;padding:10px;border-radius:10px;
    font:600 .95rem Inter,sans-serif;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--ink)}
  .card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
  h2{font-family:Fraunces,serif;font-weight:600;font-size:1.25rem;margin:0 0 12px}
  label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 6px}
  .hint{color:var(--muted);font-size:.82rem;margin:4px 0 0}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;
    padding:12px 16px;font:600 .95rem Inter,sans-serif;cursor:pointer;background:var(--red);color:#fff}
  .btn:hover{background:var(--red-d)}
  .btn.full{width:100%;margin-top:14px;padding:14px}
  .btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
  .btn.ghost:hover{background:#f3ecdf}
  .btn.small{padding:8px 12px;font-size:.85rem}
  .btn.green{background:var(--green)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#f1e9dc;border-radius:999px;padding:6px 8px 6px 12px;font-size:.9rem}
  .chip button{border:0;background:#e2d6c3;border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--ink);line-height:1}
  .empty{color:var(--muted);font-size:.88rem;margin-top:8px}
  .err{background:#fde8e6;color:var(--red-d);padding:10px 12px;border-radius:10px;font-size:.88rem;margin-top:12px}
  .ok{background:#e4f2ec;color:var(--green);padding:10px 12px;border-radius:10px;font-size:.88rem;margin-top:12px}
  .list{list-style:none;padding:0;margin:0}
  .list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .list li:last-child{border-bottom:0}
  .name{font-weight:600}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;color:var(--muted);word-break:break-all}
  .reveal{text-align:center;padding:26px 10px}
  .reveal .gift{font-size:3.2rem}
  .reveal .who{font-family:Fraunces,serif;font-size:2rem;font-weight:800;color:var(--red);margin:6px 0}
  .meta{color:var(--muted);font-size:.9rem}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .people button{padding:14px 10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font:600 .95rem Inter,sans-serif;cursor:pointer}
  .people button.done{opacity:.4;text-decoration:line-through}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modes label{margin:0;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:500;font-size:.88rem;background:#fff}
  .modes label b{display:block;font-size:.95rem;margin-bottom:2px}
  .modes input{display:none}
  .modes input:checked + span{color:var(--green)}
  .modes label:has(input:checked){border-color:var(--green);background:#eef7f3}
  .hidden{display:none !important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .snow{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;
    background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);
    background-size:60px 60px,110px 110px;background-position:0 0,30px 50px}
</style>
</head>
<body>
<div class="snow"></div>
<div class="wrap">
  <header>
    <h1>🎅 Secret Santa</h1>
    <p>Wpisz kod, który dostałeś/aś</p>
  </header>
  <div class="card" id="codeEntry">
    <h2>Twój kod</h2>
    <input id="codeIn" placeholder="np. 4K7Q-M3XA-2B" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:1.1rem;letter-spacing:1px">
    <button class="btn full" id="revealBtn">Pokaż, kogo wylosowałem/am</button>
    <div id="codeErr" class="err hidden">Ten kod nie wygląda poprawnie. Sprawdź, czy przepisałeś/aś go w całości.</div>
  </div>
  <div class="card hidden" id="codeReveal">
    <div class="reveal">
      <div class="gift">🎁</div>
      <p>Kupujesz prezent dla:</p>
      <div class="who" id="crWho"></div>
      <p class="meta">Ciii… nikomu nie mów 🤫</p>
      <button class="btn ghost full" id="crHide">Ukryj</button>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const ALPH = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  function stream(seed, n){ let s=(seed*2654435761 ^ 0x5EC2E7)>>>0; const o=[]; for(let i=0;i<n;i++){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; o.push(s&255); } return o; }
  function sum(bytes){ return bytes.reduce((a,b)=>(a*31+b)&255, 7); }
  function toB32(bytes){ let bits=0,val=0,out=''; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=ALPH[(val>>>(bits-5))&31]; bits-=5; } val&=(1<<bits)-1; } if(bits) out+=ALPH[(val<<(5-bits))&31]; return out; }
  function fromB32(str){ let bits=0,val=0; const out=[]; for(const ch of str){ const v=ALPH.indexOf(ch); if(v<0) return null; val=(val<<5)|v; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } val&=(1<<bits)-1; } return out; }
  function decode(code){
    const clean = code.toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/[IL]/g,'1').replace(/O/g,'0');
    if (clean.length < 4) return null;
    const raw = fromB32(clean); if (!raw || raw.length < 3) return null;
    const salt = raw[0], enc = raw.slice(1,-1), ks = stream(salt, enc.length);
    const data = enc.map((b,i)=>b^ks[i]);
    if (sum([salt, ...data]) !== raw[raw.length-1]) return null;
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(data)); }catch(e){ return null; }
  }


  $('revealBtn').onclick = () => {
    const r = decode($('codeIn').value);
    $('codeErr').classList.toggle('hidden', !!r);
    if (!r) return;
    $('crWho').textContent = r;
    $('codeEntry').classList.add('hidden'); $('codeReveal').classList.remove('hidden');
  };
  $('codeIn').addEventListener('keydown', e => { if (e.key==='Enter') $('revealBtn').click(); });
  $('crHide').onclick = () => { $('codeReveal').classList.add('hidden'); $('codeEntry').classList.remove('hidden'); $('codeIn').value=''; };
})();
</script>
</body>
</html>
